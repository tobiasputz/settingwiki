<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}{{ wiki.title if wiki else 'Loreforge' }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/wiki.css?v=137">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="ambient-grain"></div>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark">✦</span>
      <span><strong>{{ wiki.title if wiki else 'Loreforge' }}</strong><small>Campaign Atlas</small></span>
    </a>
    <nav class="site-nav">
      <a href="/">Codex</a>
      <a href="/network">Lore Network</a>
      {% if maps %}<a href="/#atlas">Atlas</a>{% endif %}
      <button class="search-open" data-open-search aria-label="Search">⌕ <span>Search</span><kbd>/</kbd></button>
    </nav>
  </header>

  {% block body %}{% endblock %}

  <div class="search-overlay" id="searchOverlay" aria-hidden="true">
    <div class="search-panel">
      <div class="search-top"><span>⌕</span><input id="globalSearch" placeholder="Search the setting…" autocomplete="off"><kbd>ESC</kbd></div>
      <div id="searchResults" class="search-results"><div class="search-hint">Type a place, person, faction, item, or phrase.</div></div>
    </div>
  </div>
  <script src="/static/wiki.js?v=137"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
