<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ handout.title }}</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px 18px;background:#d3ccc0;color:#30291f;font-family:Georgia,'Times New Roman',serif}.hc-paper{--paper:#f1e2bc;background:var(--paper);max-width:780px;min-height:900px;margin:auto;padding:65px 60px;border:1px solid #a58b57;box-shadow:0 10px 45px #0002;overflow-wrap:anywhere}.theme-ivory{--paper:#fffdf5;border:6px double #a79059}.theme-weathered{--paper:#dfc69a;border:3px dashed #9c7951}.theme-midnight{--paper:#252638;color:#e8dfc9;border:4px double #b4a67d}.theme-ink{--paper:white;color:black;border:0;box-shadow:none}.theme-crimson{--paper:#fcf0de;border-top:16px solid #7c2431;color:#4c2027}h1{text-align:center;font-size:38px;line-height:1.15;margin:12px 0 30px}h2{text-align:center;font-size:22px;font-weight:normal}p{line-height:1.75;white-space:normal}.hc-subtitle{text-align:center;font-style:italic}.hc-signature{margin-top:40px;font-style:italic;text-align:right}.hc-seal{text-align:center;margin-top:36px;letter-spacing:.12em}.preset-wanted h1,.preset-notice h1,.preset-royal_decree h1{text-transform:uppercase;letter-spacing:.08em}.preset-inscription{text-align:center}.preset-newspaper h1{border-bottom:4px double;padding-bottom:20px}.preset-menu p,.preset-shop p{text-align:center}.preset-journal p,.preset-diary p{font-style:italic}.preset-relic{min-height:440px;max-width:540px}.preset-letter h1{font-style:italic;font-weight:normal}img{max-width:100%}@media(max-width:500px){body{padding:12px}.hc-paper{padding:32px 22px}h1{font-size:29px}}@page{size:A4;margin:14mm}@media print{body{background:white;padding:0}.hc-paper{box-shadow:none;min-height:0;max-width:none;padding:12mm;print-color-adjust:exact;-webkit-print-color-adjust:exact}p{orphans:3;widows:3}h1,h2{break-after:avoid}}
</style></head><body><article class="hc-paper theme-{{ theme }} preset-{{ handout.kind }}"><h1>{{ handout.title }}</h1>{{ handout.body|safe }}{% if handout.image_url %}<img src="{{ handout.image_url }}" alt="Document illustration">{% endif %}</article></body></html>
